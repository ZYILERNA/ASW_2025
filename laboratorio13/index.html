<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario de Inscripción II</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Formulario de Inscripción</h1>

        <form id="formulario-inscripcion" action="procesar.php" method="POST" novalidate>

            <fieldset>
                <legend>Datos Personales</legend>

                <label for="nombre">Nombre completo</label>
                <input type="text" id="nombre" name="nombre"
                       placeholder="Ej: Ana García López"
                       required>

                <label for="email">Correo electrónico</label>
                <input type="email" id="email" name="email"
                       placeholder="Ej: ana@ejemplo.com"
                       required>

                <label for="contrasena">Contraseña</label>
                <input type="password" id="contrasena" name="contrasena"
                       placeholder="Mínimo 8 caracteres, mayúscula, minúscula y número"
                       minlength="8"
                       required>

                <label for="lenguaje">Lenguaje favorito</label>
                <select id="lenguaje" name="lenguaje" required>
                    <option value="">-- Selecciona una opción --</option>
                    <option value="html">HTML</option>
                    <option value="js">JavaScript</option>
                    <option value="python">Python</option>
                </select>

                <label for="motivacion">Motivación</label>
                <textarea id="motivacion" name="motivacion"
                          placeholder="Explica por qué quieres inscribirte..."
                          maxlength="200" rows="5"></textarea>
                <span id="contador">0 / 200</span>

            </fieldset>

            <button type="submit">Enviar inscripción</button>

        </form>
    </div>

    <script src="script.js"></script>
</body>
</html>
